<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>GeoLayers Game</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=20250901" />
</head>
<body>
  <div id="map"></div>
  <input id="guess" type="text" placeholder="Guess country..." list="countriesList" autocomplete="off" />
  <datalist id="countriesList"></datalist>
  <div id="score"></div>
  <div id="guessed"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
  <script src="main.v20250901.js"></script>
  <script>
    (function(){
      try { console.log('GeoLayers HTML version 20250901'); } catch(e){}
      // Only purge caches/unregister SW in dev
      try {
        const params = new URLSearchParams(location.search);
        const devParam = String(params.get('dev')||'');
        const DEV = /^(1|true|yes)$/i.test(devParam) || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (DEV) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
          }
          if (window.caches && caches.keys) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(()=>{});
          }
        }
      } catch {}
    })();

    // Dev: auto-reload when assets change
    (function(){
      const isLocal = /^localhost$|^127\.0\.0\.1$/.test(location.hostname);
      if(!isLocal) return;
      try {
        const es = new EventSource('/livereload');
        es.onmessage = (e) => {
          console.log('🔁 Reload (iframe) due to change:', e.data);
          location.reload();
        };
      } catch {}
    })();
  </script>
</body>
</html>
